services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: sv, POSTGRES_PASSWORD: change-me-db, POSTGRES_DB: smartverify }
    volumes: [pgdata:/var/lib/postgresql/data]
  web:
    build: .
    depends_on: [db]
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg2://sv:change-me-db@db/smartverify
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}                 # long random string
      DOC_ENCRYPTION_KEY: ${DOC_ENCRYPTION_KEY:?set DOC_ENCRYPTION_KEY}   # python -c "from cryptography.fernet import Fernet;print(Fernet.generate_key().decode())"
      SESSION_COOKIE_SECURE: "1"                                 # serve over HTTPS
    volumes: [uploads:/app/uploads]
volumes: { pgdata: {}, uploads: {} }
